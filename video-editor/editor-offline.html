<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6496ff;
            --danger: #ff6b6b;
            --success: #51cf66;
            --bg-dark: #0f0f0f;
            --bg-light: #1a1a1a;
            --border: #333;
            --text: #fff;
            --text-muted: #888;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 16px;
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, #5185ff 100%);
            padding: 20px 16px;
            margin-bottom: 20px;
            border-radius: 12px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .tab-btn {
            padding: 12px 16px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 30px 16px;
            text-align: center;
            cursor: pointer;
            background: rgba(100, 150, 255, 0.05);
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(100, 150, 255, 0.1);
        }

        .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(100, 150, 255, 0.15);
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .upload-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .upload-hint {
            font-size: 12px;
            color: var(--text-muted);
        }

        input[type="file"] {
            display: none;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .media-item {
            position: relative;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }

        .media-item img,
        .media-item video {
            width: 100%;
            height: 80px;
            object-fit: cover;
            display: block;
        }

        .media-icon {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: #2a2a2a;
        }

        .media-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
            display: none;
        }

        .media-item:hover .media-remove {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview {
            width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-bottom: 16px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview img,
        .preview video {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        .preview-placeholder {
            color: var(--text-muted);
            text-align: center;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(100, 150, 255, 0.2);
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .timeline-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
        }

        .timeline-name {
            flex: 1;
            font-weight: 500;
        }

        .timeline-size {
            color: var(--text-muted);
            font-size: 11px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .setting {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .setting select {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 8px;
            font-size: 13px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: var(--bg-dark);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn + .btn {
            margin-top: 8px;
        }

        .status {
            background: rgba(100, 150, 255, 0.1);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .status-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .status-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .toast {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: var(--bg-light);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            border-left-color: var(--success);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 20px;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .tab-btn {
                font-size: 11px;
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Video Editor Pro</h1>
            <p>Upload, edite e exporte seus vídeos</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'upload')">📤 Upload</button>
            <button class="tab-btn" onclick="switchTab(event, 'editor')">✏️ Editor</button>
            <button class="tab-btn" onclick="switchTab(event, 'export')">💾 Exportar</button>
        </div>

        <!-- Upload Tab -->
        <div id="upload" class="tab-content active">
            <div class="card">
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">Clique ou arraste aqui</div>
                    <div class="upload-hint">Vídeos, Imagens ou Áudio</div>
                </div>
                <input type="file" id="fileInput" multiple accept="video/*,image/*,audio/*" onchange="handleFileSelect(event)">
                <div class="media-grid" id="mediaGrid"></div>
            </div>
        </div>

        <!-- Editor Tab -->
        <div id="editor" class="tab-content">
            <div class="preview" id="preview">
                <div class="preview-placeholder">Selecione um arquivo para visualizar</div>
            </div>

            <div class="card">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">📝 Descrição (Prompt)</label>
                <textarea id="promptText" placeholder="Descreva as edições que você quer fazer..."></textarea>
            </div>

            <div class="card">
                <label style="display: block; margin-bottom: 12px; font-weight: 500;">⏱️ Timeline</label>
                <div class="timeline" id="timeline"></div>
            </div>
        </div>

        <!-- Export Tab -->
        <div id="export" class="tab-content">
            <div class="status">
                <div class="status-label">Arquivos Adicionados</div>
                <div class="status-value" id="fileCount">0</div>
            </div>

            <div class="card">
                <label style="display: block; margin-bottom: 12px; font-weight: 500;">⚙️ Configurações</label>
                <div class="settings-grid">
                    <div class="setting">
                        <label>Qualidade</label>
                        <select id="quality">
                            <option value="720">720p</option>
                            <option value="1080" selected>1080p</option>
                            <option value="2160">2160p</option>
                        </select>
                    </div>
                    <div class="setting">
                        <label>FPS</label>
                        <select id="fps">
                            <option value="24">24 FPS</option>
                            <option value="30" selected>30 FPS</option>
                            <option value="60">60 FPS</option>
                        </select>
                    </div>
                </div>

                <button class="btn btn-primary" onclick="exportVideo()">
                    <span>⬇️</span> Exportar Vídeo
                </button>
                <button class="btn btn-secondary" onclick="resetEditor()">
                    🔄 Limpar
                </button>
            </div>
        </div>
    </div>

    <script>
        let mediaFiles = [];

        function switchTab(event, tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'export') {
                document.getElementById('fileCount').textContent = mediaFiles.length;
            }
        }

        const uploadArea = document.getElementById('uploadArea');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.remove('dragover');
            });
        });

        uploadArea.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            handleFiles(files);
        });

        function handleFileSelect(event) {
            handleFiles(event.target.files);
        }

        function handleFiles(files) {
            if (mediaFiles.length + files.length > 10) {
                showToast('Máximo 10 arquivos', 'error');
                return;
            }

            for (let file of files) {
                if (file.size > 500 * 1024 * 1024) {
                    showToast(`${file.name} muito grande`, 'error');
                    continue;
                }

                const type = file.type.split('/')[0] || 'arquivo';
                const fileObj = {
                    id: Date.now() + Math.random(),
                    file: file,
                    name: file.name,
                    type: type,
                    size: file.size,
                    url: URL.createObjectURL(file)
                };

                mediaFiles.push(fileObj);
            }

            updateUI();
            showToast(`✓ Arquivo(s) adicionado(s)`, 'success');
        }

        function updateUI() {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = mediaFiles.map(media => `
                <div class="media-item">
                    ${media.type === 'video' ? `<video src="${media.url}"></video>` : media.type === 'image' ? `<img src="${media.url}">` : `<div class="media-icon">🔊</div>`}
                    <button class="media-remove" onclick="removeMedia('${media.id}')">✕</button>
                </div>
            `).join('');

            const timeline = document.getElementById('timeline');
            timeline.innerHTML = mediaFiles.map((m, i) => `
                <div class="timeline-item">
                    <span style="color: var(--primary); font-weight: 600;">${i + 1}</span>
                    <div class="timeline-name">${m.name}</div>
                    <div class="timeline-size">${(m.size / 1024 / 1024).toFixed(1)}MB</div>
                </div>
            `).join('');
        }

        function removeMedia(id) {
            mediaFiles = mediaFiles.filter(m => m.id !== id);
            updateUI();
            showToast('Removido', 'success');
        }

        function previewMedia(index) {
            const media = mediaFiles[index];
            const preview = document.getElementById('preview');
            preview.innerHTML = `
                ${media.type === 'video' ? `<video src="${media.url}" controls></video>` : media.type === 'image' ? `<img src="${media.url}">` : `<audio src="${media.url}" controls></audio>`}
            `;
        }

        // Make media items clickable
        document.addEventListener('click', (e) => {
            if (e.target.closest('.media-item') && !e.target.closest('.media-remove')) {
                const item = e.target.closest('.media-item');
                const index = Array.from(document.getElementById('mediaGrid').children).indexOf(item);
                previewMedia(index);
            }
        });

        function exportVideo() {
            if (mediaFiles.length === 0) {
                showToast('Adicione arquivos primeiro!', 'error');
                return;
            }

            const quality = document.getElementById('quality').value;
            const fps = document.getElementById('fps').value;
            const prompt = document.getElementById('promptText').value;

            const metadata = {
                files: mediaFiles.map(m => ({
                    name: m.name,
                    type: m.type,
                    size: (m.size / 1024 / 1024).toFixed(2) + 'MB'
                })),
                quality: quality + 'p',
                fps: fps,
                prompt: prompt,
                timestamp: new Date().toLocaleString('pt-BR')
            };

            const dataStr = JSON.stringify(metadata, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `video-export-${Date.now()}.json`;
            link.click();

            showToast('✓ Exportado com sucesso!', 'success');
        }

        function resetEditor() {
            if (confirm('Limpar tudo?')) {
                mediaFiles = [];
                document.getElementById('promptText').value = '';
                document.getElementById('fileInput').value = '';
                document.getElementById('preview').innerHTML = '<div class="preview-placeholder">Selecione um arquivo para visualizar</div>';
                updateUI();
                showToast('Limpado', 'success');
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        updateUI();
    </script>
</body>
</html>
